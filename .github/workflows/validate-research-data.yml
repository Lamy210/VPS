name: Validate research data

on:
  pull_request:
    paths:
      - "data/**"
      - "requirements/**"
      - "results/**"
      - "scripts/validate_research_data.py"
      - ".github/workflows/validate-research-data.yml"
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "requirements/**"
      - "results/**"
      - "scripts/validate_research_data.py"
      - ".github/workflows/validate-research-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Validate research data
        run: python scripts/validate_research_data.py
