quality_invariants:
  - unknown_hard_fields_never_pass
  - provider_advertised_performance_is_not_benchmark_evidence
  - promotional_and_renewal_prices_are_separate
  - annualized_prepaid_price_is_not_ordinary_monthly_price
  - ddos_capacity_is_not_public_port_speed
  - physical_threads_are_not_silently_counted_as_vcpu
  - shared_port_speed_is_not_guaranteed_sustained_throughput
  - up_to_bandwidth_is_not_guaranteed_sustained_throughput
  - full_virtualization_does_not_prove_kvm
  - openstack_or_qemu_does_not_prove_kvm_acceleration
  - native_currency_is_preserved
  - official_price_conflicts_remain_unresolved
  - marketing_region_does_not_prove_datacenter_region
  - snapshots_do_not_automatically_equal_independent_backups
  - provider_count_excludes_targeted_followup_duplicates
