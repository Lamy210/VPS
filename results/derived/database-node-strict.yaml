schema_version: 1
profile: requirements/profiles/database-node.yaml
derived_at: 2026-08-16
source_policy: verified-batches-plus-followups
rules:
  - Every hard requirement must be explicitly verified before a resource is placed in clear_pass.
  - Missing private networking, KVM, NVMe, transfer, port speed, snapshot, backup, SLA, or budget normalization produces unknown rather than pass.
  - Dedicated or guaranteed CPU is preferred by the profile but is not by itself a hard requirement when shared CPU is explicitly accepted.
  - Provider-advertised storage replication or HA is not a substitute for an independent backup unless the backup requirement is separately verified.

