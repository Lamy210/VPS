schema_version: 1
profile: requirements/profiles/database-node.yaml
derived_at: 2026-08-16
source_policy: verified-batches-plus-followups
rules:
  - Every hard requirement must be explicitly verified before a resource is placed in clear_pass.
  - Missing private networking, KVM, NVMe, transfer, port speed, snapshot, backup, SLA, or effective TCO produces unknown rather than pass.
  - Dedicated or guaranteed CPU is preferred by the profile but shared CPU is accepted when all hard fields pass.
  - Provider-advertised replication or HA does not replace an independent-backup requirement.
  - Backup feature availability is not assumed to be included in base VM pricing when the selected-plan charge is not published.

