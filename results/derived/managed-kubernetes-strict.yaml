next_verification_actions:
  - Complete UpCloud first because it already has private workers, Terraform, API, native autoscaling, and a managed load balancer in the verified data.
  - Complete Scaleway and Exoscale next; both already verify private networking, Terraform, API, and native autoscaling.
  - Verify DigitalOcean Terraform support and monitoring integration, then pin an exact qualifying worker size and full TCO.
  - For GKE and AKS, capture a concrete worker shape, VPC/private networking, load balancer, Terraform, and monitoring in one region rather than relying on platform-wide feature assumptions.
