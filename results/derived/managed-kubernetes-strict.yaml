schema_version: 1
profile: requirements/profiles/managed-kubernetes.yaml
derived_at: 2026-08-16
source_policy: verified-batches-plus-followups
rules:
  - Every hard requirement must be explicitly verified before a provider is placed in clear_pass.
  - A managed Kubernetes product alone is insufficient: private networking, load balancing, API, Terraform/OpenTofu, native autoscaling, worker capacity, and monitoring integration must all be checked.
  - Control-plane fees and worker-node costs remain separate TCO components.
  - Unknown worker-plan storage or network capacity produces unknown rather than pass.

clear_pass:
  - provider: UpCloud
    service: Managed_Kubernetes
    source_batch: results/verified/batch-001.yaml
    followup: results/verified/followup-003.yaml
    confidence: A
    selected_worker:
      plan: PREMIUM-2xCPU-4GB
      vcpu: 2
      memory_gb: 4
      storage_gb: 50
      storage_type: maxiops_ssd
      public_port_mbps: 1000
      ipv4_included: true
      ipv6_included: true
    platform_match:
      managed_kubernetes: true
      private_network: true
      managed_load_balancer: true
      native_cluster_autoscaler: true
      node_group_min_max: true
      api: true
      terraform: true
      monitoring_integration: [prometheus, opentelemetry, grafana]
      horizontal_scaling: true
      control_plane_development_usd_month: 0
    validation_priority: high
    notes:
      - All current reusable managed-Kubernetes hard requirements are covered by official UpCloud documentation for a concrete qualifying worker architecture.
      - TCO remains a separate derived comparison because this profile currently has no hard monthly budget.
      - Operational validation should measure autoscaler reaction time, node readiness, load-balancer provisioning and API limits before recommendation.

blocked_by_unknown:
