    source_batch: results/verified/batch-004.yaml
    verified_strengths: [managed_kubernetes, free_shared_control_plane, vpc_integration, node_pool_autoscaling, autohealing, api, terraform, load_balancer, cockpit_monitoring, prometheus_grafana_monitoring]
    unresolved_hard_requirements: [qualifying_worker_shape_with_at_least_40gb_storage_and_1gbps, ipv4_for_selected_worker_architecture]
    strict_status: unknown
    verification_priority: very_high
    notes:
      - Many lower-cost worker shapes expose sub-1-Gbps public bandwidth; pin a concrete >=1-Gbps worker and public IPv4 behavior before strict qualification.

