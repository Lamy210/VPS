next_verification_actions:
  - Operationally validate UpCloud first: node-pool scale up/down latency, node-ready latency, load-balancer provisioning time, API limits, failure recovery and TCO.
  - Complete Scaleway next by pinning a >=1-Gbps qualifying worker shape with >=40 GB storage and explicit public IPv4 behavior.
  - Complete Exoscale by resolving load balancer, monitoring, local storage and selected worker IPv4 facts.
  - Complete DigitalOcean by pinning a qualifying worker shape, monitoring integration, and selected worker private-network semantics.
  - For GKE and AKS, capture a concrete worker shape, private networking, load balancer, Terraform, and monitoring in one region rather than relying on platform-wide feature assumptions.
