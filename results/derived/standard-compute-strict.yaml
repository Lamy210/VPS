schema_version: 1
profile: requirements/profiles/standard-compute.yaml
derived_at: 2026-08-16
source_policy: verified-batches-plus-followups
rules:
  - Every hard requirement must be explicitly verified before a resource is placed in clear_pass.
  - Missing virtualization, network-port, IPv4, transfer, contract, or price facts produce unknown rather than pass.
  - Shared or up-to port speed is an interface/uplink characteristic, not guaranteed sustained throughput.
  - DDoS-protection capacity is not a VPS port-speed field.
  - Annualized or long-term prepaid pricing is not ordinary month-to-month pricing.
  - Physical CPU threads are not silently substituted for an explicit vCPU/core-count requirement.
  - Provider-advertised specifications are not performance benchmarks.

