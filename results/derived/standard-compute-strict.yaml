schema_version: 1
profile: requirements/profiles/standard-compute.yaml
derived_at: 2026-08-16
source_policy: verified-batches-plus-followups
rules:
  - Every hard requirement must be explicitly verified before a resource is placed in clear_pass.
  - Missing virtualization, network-port, IPv4, transfer, contract, or price facts produce unknown rather than pass.
  - Targeted follow-up files may resolve a blocker from an earlier source batch without changing the original observed record.
  - Shared port speed is an interface/uplink characteristic, not a guaranteed sustained-throughput result.
  - Annualized prepaid pricing is not treated as ordinary month-to-month pricing.
  - Physical CPU threads are not silently substituted for an explicit vCPU/core-count hard requirement.
  - Provider-advertised specifications are not performance benchmarks.

