schema_version: 1
profile: requirements/profiles/standard-compute.yaml
derived_at: 2026-08-16
source_policy: verified-batches-plus-followups
rules:
  - Every hard requirement must be explicitly verified before a resource is placed in clear_pass.
  - Missing virtualization, network-port, IPv4, transfer, contract, or price facts produce unknown rather than pass.
  - Targeted follow-up files may resolve a blocker from an earlier source batch without changing the original observed record.
  - Provider-advertised specifications are not performance benchmarks.

clear_pass:
  - provider: ServaRica
    plan: KVM_Slim_Slice_2
    source_batch: results/verified/batch-003.yaml
    confidence: B
    verified_match:
      monthly_price_usd: 7
      vcpu_or_cpu: 2_dedicated_cores
      memory_gb: 8
      local_storage_gb: 250
      storage_type: nvme
      monthly_transfer_tb: 8
      port_mbps: 10000
      ipv4_included: true
      virtualization: kvm
    benchmark_priority: high
    notes:
      - Clear advertised-specification match for the reusable standard-compute profile.
      - Dedicated CPU and unusually low price make benchmark validation especially important.
      - Final purchase suitability still depends on independent CPU, storage, and network measurements.

  - provider: HostEons
    plan: Hybrid_Special_2
    source_batch: results/verified/batch-003.yaml
    followup: results/verified/followup-002.yaml
    confidence: B
    verified_match:
      monthly_price_usd: 8.99
      vcpu_or_cpu: 2_dedicated_ryzen_3950x_vcores
      memory_gb: 8
      local_storage_gb: 100
      storage_type: nvme
      monthly_transfer_tb: 30
      port_mbps: 10000
      ipv4_included: true
      ipv6_prefix: /64
      virtualization: kvm
    benchmark_priority: high
    notes:
      - Follow-up verification resolves the exact VDS/Hybrid KVM requirement using HostEons official product and knowledgebase evidence.
      - Dedicated CPU at a sub-10-USD price makes independent sustained-load and network validation high priority.

  - provider: Advin_Servers
    plan: KVM_Premium_S_Miami
    source_batch: results/verified/batch-009.yaml
    followup: results/verified/followup-004.yaml
    confidence: A
    verified_match:
      monthly_price_usd: 10
      vcpu_or_cpu: 4_shared_vcpu
      memory_gb: 8
      local_storage_gb: 128
      storage_type: nvme
      monthly_transfer_tb: 5
      port_mbps: 10000
      ipv4_included: true
      virtualization: kvm
      contract: monthly_no_contract
    benchmark_priority: high
    notes:
      - Uses the ordinary Premium S 10 USD/month tier rather than relying on the separate promotional Standard XS price.
      - Shared vCPU makes sustained CPU and steal-time measurements important before recommendation.

