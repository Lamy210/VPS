schema_version: 1
profile: requirements/profiles/standard-compute.yaml
derived_at: 2026-08-16
source_policy: verified-batches-only
rules:
  - Every hard requirement must be explicitly verified before a resource is placed in clear_pass.
  - Missing virtualization, network-port, IPv4, transfer, contract, or price facts produce unknown rather than pass.
  - This derived file may be stricter than a preliminary profile_assessment stored in an earlier verification batch.
  - Provider-advertised specifications are not performance benchmarks.

clear_pass:
  - provider: ServaRica
    plan: KVM_Slim_Slice_2
    source_batch: results/verified/batch-003.yaml
    confidence: B
    verified_match:
      monthly_price_usd: 7
      vcpu_or_cpu: 2_dedicated_cores
      memory_gb: 8
      local_storage_gb: 250
      storage_type: nvme
      monthly_transfer_tb: 8
      port_mbps: 10000
      ipv4_included: true
      virtualization: kvm
    benchmark_priority: high
    notes:
      - Clear advertised-specification match for the reusable standard-compute profile.
      - Dedicated CPU and unusually low price make benchmark validation especially important.
      - Final purchase suitability still depends on independent CPU, storage, and network measurements.

