schema_version: 1
updated_at: 2026-08-16
purpose: benchmark_readiness_queue
rules:
  - A provider is ready only after all hard requirements for the target profile are verified.
  - Blocked entries mean benchmark spend should wait until the listed verification blockers are resolved.
  - No benchmark result is implied by appearing in this queue.
  - Provider-advertised benchmark claims are not stored as measured evidence.
  - Shared uplink speed is not a guaranteed sustained-throughput result.
  - Benchmark records must pin exact region, plan, OS image, kernel, tool version, and full command parameters.

ready:
  - provider: ServaRica
    plan: KVM_Slim_Slice_2
    target_profile: standard-compute
    source: results/derived/standard-compute-strict.yaml
    priority: high
    required_tests:
      cpu: [sustained_all_core_load, single_thread_baseline, steal_time_idle_and_load, frequency_and_throttling_observation]
      storage: [fio_random_4k_qd1, fio_random_4k_qd32, fio_sequential_read_write, fsync_latency]
      database: [postgres_pgbench_short, postgres_fsync_sensitive_transaction_test]
      network: [rtt_to_relevant_reference_regions, packet_loss, sustained_single_stream_throughput, sustained_multi_stream_throughput]
      stability: [repeated_test_runs_across_time_windows]

  - provider: HostEons
    plan: Hybrid_Special_2
    target_profile: standard-compute
    source: results/derived/standard-compute-strict.yaml
    priority: high
    required_tests:
      cpu: [sustained_all_core_load, single_thread_baseline, steal_time_idle_and_load, frequency_and_throttling_observation]
      storage: [fio_random_4k_qd1, fio_random_4k_qd32, fio_sequential_read_write, fsync_latency]
      network: [rtt_to_relevant_reference_regions, packet_loss, sustained_single_stream_throughput, sustained_multi_stream_throughput]
      stability: [repeated_test_runs_across_time_windows]

  - provider: Advin_Servers
    plan: KVM_Premium_S_Miami
    target_profile: standard-compute
    source: results/derived/standard-compute-strict.yaml
    priority: high
    required_tests:
      cpu: [sustained_all_core_load, single_thread_baseline, steal_time_idle_and_load, frequency_and_throttling_observation]
      storage: [fio_random_4k_qd1, fio_random_4k_qd32, fio_sequential_read_write, fsync_latency]
      network: [rtt_to_relevant_reference_regions, packet_loss, sustained_single_stream_throughput, sustained_multi_stream_throughput]
      stability: [repeated_test_runs_across_time_windows]
    notes:
      - Shared vCPU architecture makes steal-time and sustained-load consistency high-priority measurements.

  - provider: InterServer
    plan: Cloud_Compute_4_Slices
    target_profile: standard-compute
    source: results/derived/standard-compute-strict.yaml
    priority: high
    required_tests:
      cpu: [sustained_all_core_load, single_thread_baseline, steal_time_idle_and_load, frequency_and_throttling_observation]
      storage: [fio_random_4k_qd1, fio_random_4k_qd32, fio_sequential_read_write, fsync_latency]
      network: [rtt_to_relevant_reference_regions, packet_loss, sustained_single_stream_throughput, sustained_multi_stream_throughput, shared_port_contention_behavior]
      stability: [repeated_test_runs_across_time_windows]
    notes:
      - Provider documentation explicitly warns that the 10 Gbps port is shared and sustained throughput can vary with node contention.
      - Benchmark the exact region because node hardware and neighbor utilization may differ.

  - provider: UpCloud
    service: Managed_Kubernetes
    worker_plan: PREMIUM-2xCPU-4GB
    target_profile: managed-kubernetes
    source: results/derived/managed-kubernetes-strict.yaml
    priority: high
    validation_type: operational_and_scaling
    required_tests:
      provisioning: [cluster_control_plane_provision_time, worker_node_group_provision_time, managed_load_balancer_provision_time]
      autoscaling: [node_pool_scale_up_reaction_time, node_ready_latency_after_scale_up, node_pool_scale_down_latency, scale_to_zero_and_recovery_where_supported]
      network: [private_network_node_to_node_rtt, public_worker_throughput, load_balancer_health_check_recovery]
      reliability: [unhealthy_node_replacement_behavior, worker_rejoin_after_disruption]
      automation: [terraform_apply_destroy_reproducibility, api_rate_limit_observation]
      observability: [prometheus_metrics_collection, opentelemetry_signal_export, alerting_pipeline_smoke_test]
      tco: [control_plane_cost, two_worker_cost, load_balancer_cost, required_ipv4_cost, storage_cost, nat_cost_if_private_workers_selected]

