schema_version: 1
updated_at: 2026-08-16
purpose: benchmark_readiness_queue
rules:
  - A provider is `ready` only after all hard requirements for the target profile are verified.
  - `blocked` means benchmark spend should wait until the listed verification blockers are resolved.
  - No benchmark result is implied by appearing in this queue.
  - Provider-advertised benchmark claims are not stored as measured evidence.
  - Benchmark records must pin exact region, plan, OS image, kernel, tool version, and full command parameters.

ready:
  - provider: ServaRica
    plan: KVM_Slim_Slice_2
    target_profile: standard-compute
    source: results/derived/standard-compute-strict.yaml
    priority: high
    reason:
      - Clear hard-filter pass for the reusable standard-compute profile.
      - Very low price and dedicated CPU justify validating oversubscription, storage latency, and network consistency before recommendation.
    required_tests:
      cpu:
        - sustained_all_core_load
        - single_thread_baseline
        - steal_time_idle_and_load
        - frequency_and_throttling_observation
      storage:
        - fio_random_4k_qd1
        - fio_random_4k_qd32
        - fio_sequential_read_write
        - fsync_latency
      database:
        - postgres_pgbench_short
        - postgres_fsync_sensitive_transaction_test
      network:
        - rtt_to_relevant_reference_regions
        - packet_loss
        - sustained_single_stream_throughput
        - sustained_multi_stream_throughput
      stability:
        - repeated_test_runs_across_time_windows

  - provider: HostEons
    plan: Hybrid_Special_2
    target_profile: standard-compute
    source: results/verified/followup-002.yaml
    priority: high
    reason:
      - Follow-up verification resolves the remaining KVM hard requirement for the exact Hybrid/VDS product family.
      - Current official sources verify 2 dedicated Ryzen 3950X vCores, 8 GB RAM, 100 GB NVMe, 30 TB transfer, 10 Gbps, one IPv4, /64 IPv6, and 8.99 USD/month.
      - Dedicated CPU at a sub-10-USD price warrants independent consistency and saturation testing.
    required_tests:
      cpu:
        - sustained_all_core_load
        - single_thread_baseline
        - steal_time_idle_and_load
        - frequency_and_throttling_observation
      storage:
        - fio_random_4k_qd1
        - fio_random_4k_qd32
        - fio_sequential_read_write
        - fsync_latency
      network:
        - rtt_to_relevant_reference_regions
        - packet_loss
        - sustained_single_stream_throughput
        - sustained_multi_stream_throughput
      stability:
        - repeated_test_runs_across_time_windows

blocked:
  - provider: Onie_Cloud
    plan: VM_4_8
    target_profile: standard-compute
    priority_after_clearance: high
    blockers: [kvm_virtualization, normalized_usd_tco, promotional_price_persistence]
    post_clearance_focus: [sustained_cpu, steal_time, nvme_latency, 10gbps_realistic_throughput, vietnam_to_asia_rtt]

  - provider: Advin_Servers
    plan: KVM_Standard_XS_Miami
    target_profile: standard-compute
    priority_after_clearance: high
    blockers: [ipv4_included, promotional_price_persistence]
    post_clearance_focus: [steal_time, sustained_cpu, nvme_latency, 10gbps_realistic_throughput]

  - provider: HostBrr
    plan: EPYC_8GBrr
    target_profile: standard-compute
    priority_after_clearance: high
    blockers: [current_numeric_price]
    post_clearance_focus: [steal_time, epyc_9004_sustained_cpu, nvme_latency, network_consistency]

