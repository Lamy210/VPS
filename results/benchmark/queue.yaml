schema_version: 1
updated_at: 2026-08-16
purpose: benchmark_readiness_queue
rules:
  - A provider is `ready` only after all hard requirements for the target profile are verified.
  - "`blocked` means benchmark spend should wait until the listed verification blockers are resolved."
  - No benchmark result is implied by appearing in this queue.
  - Provider-advertised benchmark claims are not stored as measured evidence.
  - Benchmark records must pin exact region, plan, OS image, kernel, tool version, and full command parameters.

ready:
  - provider: ServaRica
    plan: KVM_Slim_Slice_2
    target_profile: standard-compute
    source: results/derived/standard-compute-strict.yaml
    priority: high
    required_tests:
      cpu: [sustained_all_core_load, single_thread_baseline, steal_time_idle_and_load, frequency_and_throttling_observation]
      storage: [fio_random_4k_qd1, fio_random_4k_qd32, fio_sequential_read_write, fsync_latency]
      database: [postgres_pgbench_short, postgres_fsync_sensitive_transaction_test]
      network: [rtt_to_relevant_reference_regions, packet_loss, sustained_single_stream_throughput, sustained_multi_stream_throughput]
      stability: [repeated_test_runs_across_time_windows]

  - provider: HostEons
    plan: Hybrid_Special_2
    target_profile: standard-compute
    source: results/derived/standard-compute-strict.yaml
    priority: high
    required_tests:
      cpu: [sustained_all_core_load, single_thread_baseline, steal_time_idle_and_load, frequency_and_throttling_observation]
      storage: [fio_random_4k_qd1, fio_random_4k_qd32, fio_sequential_read_write, fsync_latency]
      network: [rtt_to_relevant_reference_regions, packet_loss, sustained_single_stream_throughput, sustained_multi_stream_throughput]
      stability: [repeated_test_runs_across_time_windows]

  - provider: Advin_Servers
    plan: KVM_Premium_S_Miami
    target_profile: standard-compute
    source: results/derived/standard-compute-strict.yaml
    priority: high
    required_tests:
      cpu: [sustained_all_core_load, single_thread_baseline, steal_time_idle_and_load, frequency_and_throttling_observation]
      storage: [fio_random_4k_qd1, fio_random_4k_qd32, fio_sequential_read_write, fsync_latency]
      network: [rtt_to_relevant_reference_regions, packet_loss, sustained_single_stream_throughput, sustained_multi_stream_throughput]
      stability: [repeated_test_runs_across_time_windows]
    notes:
      - Shared vCPU architecture makes steal-time and sustained-load consistency high-priority measurements.
      - Validate the exact Premium S product rather than the separate promotional Standard XS tier.

  - provider: UpCloud
    service: Managed_Kubernetes
    worker_plan: PREMIUM-2xCPU-4GB
    target_profile: managed-kubernetes
    source: results/derived/managed-kubernetes-strict.yaml
    priority: high
    validation_type: operational_and_scaling
    required_tests:
      provisioning:
        - cluster_control_plane_provision_time
        - worker_node_group_provision_time
        - managed_load_balancer_provision_time
      autoscaling:
        - node_pool_scale_up_reaction_time
        - node_ready_latency_after_scale_up
        - node_pool_scale_down_latency
        - scale_to_zero_and_recovery_where_supported
      network:
        - private_network_node_to_node_rtt
        - public_worker_throughput
        - load_balancer_health_check_recovery
      reliability:
        - unhealthy_node_replacement_behavior
        - worker_rejoin_after_disruption
      automation:
        - terraform_apply_destroy_reproducibility
        - api_rate_limit_observation
      observability:
        - prometheus_metrics_collection
        - opentelemetry_signal_export
        - alerting_pipeline_smoke_test
      tco:
        - control_plane_cost
        - two_worker_cost
        - load_balancer_cost
        - required_ipv4_cost
        - storage_cost
        - nat_cost_if_private_workers_selected

blocked:
  - provider: Onie_Cloud
    plan: VM_4_8
    target_profile: standard-compute
    priority_after_clearance: high
    blockers: [exact_public_cloud_hypervisor, normalized_usd_tco, promotional_price_persistence]
    post_clearance_focus: [sustained_cpu, steal_time, nvme_latency, 10gbps_realistic_throughput, vietnam_to_asia_rtt]

  - provider: HostBrr
    plan: EPYC_8GBrr
    target_profile: standard-compute
    priority_after_clearance: high
    blockers: [current_numeric_price]
    post_clearance_focus: [steal_time, epyc_9004_sustained_cpu, nvme_latency, network_consistency]

  - provider: VSYS_Host
    plan: VS-NVME4-16
    target_profile: database-node
    priority_after_clearance: high
    blockers: [customer_configurable_private_network_for_standard_vps]
    post_clearance_focus: [fsync_latency, pgbench, guaranteed_200mbps_vs_1gbps_uplink_behavior]

  - provider: VPSnet
    plan: KVM_3
    target_profile: database-node
    priority_after_clearance: very_high
    blockers: [private_network, normalized_usd_tco]
    post_clearance_focus: [ceph_nvme_latency, fsync_latency, replicated_storage_tail_latency, pgbench]

  - provider: Onidel
    target_profile: database-node
    priority_after_clearance: high
    blockers: [current_16gb_plan_specification, current_16gb_price, kvm_virtualization]
    post_clearance_focus: [replicated_nvme_tail_latency, failover_behavior, fsync_latency, private_network_rtt]

  - provider: ServaRica
    plan: Unified_Slim_4
    target_profile: database-node
    priority_after_clearance: very_high
    blockers: [private_network, snapshots, independent_backups]
    post_clearance_focus: [fsync_latency, pgbench, dedicated_cpu_consistency, nvme_tail_latency]

  - provider: Scaleway
    service: Kapsule
    target_profile: managed-kubernetes
    priority_after_clearance: high
    blockers: [qualifying_worker_shape_with_at_least_40gb_storage_and_1gbps, ipv4_for_selected_worker_architecture]
    post_clearance_focus: [autoscaler_reaction_time, node_ready_latency, autohealing, load_balancer_provision_time]

  - provider: Exoscale
    service: SKS
    target_profile: managed-kubernetes
    priority_after_clearance: high
    blockers: [load_balancer_required, monitoring_integration, qualifying_worker_local_storage, ipv4_for_selected_worker_architecture]
    post_clearance_focus: [cluster_autoscaler_latency, private_network_node_join_time, api_rate_limits]

