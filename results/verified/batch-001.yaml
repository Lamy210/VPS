schema_version: 1
verified_at: 2026-08-16
source_policy: official-only
notes:
  - Unknown facts are intentionally preserved as unknown rather than inferred.
  - Currency conversion is not baked into provider prices.
  - A profile assessment is conservative: unknown hard constraints do not count as pass.

providers:
