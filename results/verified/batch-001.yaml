        monthly_transfer_tb: 3
      - plan: Compute 16 GB
        currency: USD
        monthly_base: 15
        vcpu: 4
        cpu_allocation: mixed
        dedicated_cores: 2
        shared_cores: 2
        memory_gb: 16
        local_storage_gb: 75
        storage_type: nvme
        monthly_transfer_tb: 4
    network:
      private_network: true
      private_network_scope: same-region
      private_network_implementation: vlan_or_vxlan
      private_traffic_unmetered: true
      private_mtu: 9000
      public_transfer_accounting: inbound_and_outbound
      private_network_fee: unknown
    automation:
      api_exists: true
      api_general_availability: false
      api_access_note: currently limited to a select few users
      terraform: unknown
    profile_assessment:
      standard-compute:
        status: unknown
        notes:
          - 8 GB plan fails the 60 GB local-storage requirement.
          - 16 GB plan meets headline RAM, storage, transfer, and USD budget constraints.
          - Per-VM public port speed and KVM requirement remain unverified in this batch.
      database-node:
        status: unknown
        notes:
          - 16 GB plan has mixed dedicated/shared CPU and private networking.
          - Required snapshot and backup properties were not fully verified in this batch.
    sources:
      - https://hosthatch.com/products
      - https://docs.hosthatch.com/networking/
      - https://docs.hosthatch.com/api/

