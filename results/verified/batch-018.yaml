      database-node:
        status: unknown
        notes:
          - Cloud Server L 4.0 clears headline CPU/RAM/NVMe/network/availability capacity, but private networking, KVM for the selected product, snapshot semantics, independent-backup TCO, and normalized USD TCO remain unresolved.
