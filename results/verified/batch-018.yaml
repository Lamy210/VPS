schema_version: 1
verified_at: 2026-08-16
source_policy: official-only
notes:
  - This batch expands European, North American, and network-focused VPS/cloud coverage.
  - Conflicting current prices across a provider's own pages are recorded as an inconsistency rather than silently selecting the lower price.
  - Full virtualization does not prove KVM when the selected product page does not explicitly name the hypervisor.
  - OpenStack/QEMU usage does not prove KVM acceleration for the exact instance family.
  - Shared or unmetered ports are interface characteristics, not sustained-throughput guarantees.
  - Native-currency pricing is preserved until a timestamped FX/TCO derivation is applied.

providers:
  - canonical_name: BlastVPS
    confidence: A
    resource_classes: [regional_vps]
    offers:
      - plan: VPS_Pro
        currency: USD
        monthly_base: 29.99
        vcpu: 4
        cpu_family: AMD_Ryzen_9
        memory_gb: 8
        local_storage_gb: 80
        storage_type: nvme
        transfer: unlimited
        virtualization: kvm
    profile_assessment:
      standard-compute:
        status: fail
        notes:
          - The verified 8 GB unmanaged KVM tier costs 29.99 USD/month, above the reusable 15 USD ceiling.
    sources:
      - https://blastvps.com/unmanaged-vps
      - https://blastvps.com/linux-vps

