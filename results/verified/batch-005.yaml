      instant_deploy_under_seconds: 50
      api: unknown
    availability:
      sla_percent: 99.9
      premium_storage_replication: 3
    profile_assessment:
      standard-compute:
        status: unknown
        notes:
          - Both 8 GB lines exceed the resource, storage, and traffic floors, but native-currency TCO and exact guaranteed port speed must be evaluated before a final pass.
      database-node:
        status: unknown
        notes:
          - The 16 GB premium tier has 3x replicated NVMe and a 99.9% SLA, but dedicated CPU allocation, private networking, snapshots, and backup semantics remain unverified.
