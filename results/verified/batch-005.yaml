schema_version: 1
verified_at: 2026-08-16
source_policy: official-only
notes:
  - This batch focuses on regional public-cloud and VPS providers that are often absent from major global-cloud comparisons.
  - Local-currency prices are preserved in native currency; cross-currency hard filters remain unknown unless another hard constraint independently fails.
  - Promotional and regular prices are stored separately when the official page exposes both.

