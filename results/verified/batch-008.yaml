schema_version: 1
verified_at: 2026-08-16
source_policy: official-only
notes:
  - This batch adds new providers only; deeper checks of already-counted providers are stored separately as follow-up records.
  - Native-currency prices remain native unless the provider publishes USD directly.
  - Dynamic price widgets that fail to expose a stable numeric value remain unknown.
  - Promotional pricing and actual monthly pricing are not silently conflated.

providers:
  - canonical_name: IPXON
    confidence: B
    resource_classes: [regional_cloud, latin_america_cloud]
    verified_regions: [multiple_latin_america_locations, Miami]
    offers:
      - plan: Current_Plan_L_resource_shape
        vcpu: 8
        memory_gb: 8
        local_storage_gb: 75
        storage_type: ssd
        monthly_transfer_tb: 5
        port_mbps: 10000
        current_numeric_price: unknown_dynamic_widget
      - plan: Legacy_or_alternate_Cloud_Server_M2
        currency: USD
        monthly_base: 123
        vcpu: 8
        memory_gb: 16
        local_storage_gb: 50
        storage_type: ssd
        monthly_transfer_tb: 6
        port_mbps: 100
    platform:
      virtualization: kvm
    network:
      private_network: true
      private_network_bandwidth: unlimited_claimed
      private_vlan: true
      public_and_private_port_gbps_claimed: 1
      ipv4_ipv6: true
    operations:
      management_api_homepage: available_claim
      management_api_country_pages: coming_soon
      api_status_inconsistent: true
    profile_assessment:
      standard-compute:
        status: unknown
        notes:
          - Current Plan L reaches the CPU/RAM/storage/transfer/port floors but its stable current price is not exposed by the dynamic page.
          - API availability is inconsistent across current official pages and must be checked before automation use.
      database-node:
        status: fail
        notes:
          - The captured 16 GB alternate plan is far above the 30 USD budget and exposes only a 100 Mbps public port.
    sources:
      - https://www.ipxon.com/en/mx/services/vps-servers
      - https://www.ipxon.com/en/ar/services/cloud-servers
      - https://www.ipxon.com/
      - https://cdn.ipxon.com/en-us/vps-servers

