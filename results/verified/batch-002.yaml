schema_version: 1
verified_at: 2026-08-16
source_policy: official-only
notes:
  - This batch focuses on low-cost and regional compute candidates.
  - Contract term, promotion, renewal price, and current stock are kept explicit when visible.
  - Missing private-network or API information is recorded as unknown, not false.

providers:
  - canonical_name: Onidel
    confidence: B
    resource_classes: [regional_public_cloud, performance_vds]
    verified_regions: [Singapore, Ho_Chi_Minh, Amsterdam, New_York, Sydney, Melbourne]
    pricing:
      current_plan_table: unknown
      note: Official product page failed to render current plan prices during verification.
    platform:
      cpu_family_singapore: AMD_EPYC_Milan
      storage: triple_replicated_nvme
      high_availability: true
      automatic_failover: true
      sla_percent: 99.9
      sev_snp_singapore: true
    network:
      singapore_port_gbps: 1
      private_network: true
      private_traffic_unmetered: true
      floating_ip: true
      bgp: true
      ipv4_included: true
      ipv6_included: true
      bandwidth_pooling_same_region: true
      additional_bandwidth_usd_per_tb: 3
    operations:
      manual_snapshots: true
      automated_backups: true
      backup_storage_usd_per_gb_month: 0.1
      vertical_upgrade: true
    profile_assessment:
      standard-compute:
        status: unknown
        notes:
          - Core infrastructure and networking features are strongly verified.
          - Current plan price and exact 8 GB specification could not be captured, so budget filtering is impossible.
      database-node:
        status: unknown
        notes:
          - Replicated NVMe, private networking, SLA, snapshots, and automated backups are attractive database characteristics.
          - A current 16 GB/4-vCPU price and exact plan specification are still required.
    sources:
      - https://onidel.com/services/premium-vps?location=Singapore
      - https://kb.onidel.com/hc/kb/articles/1773264315-feature-matrix

