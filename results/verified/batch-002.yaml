      database-node:
        status: fail
        reasons:
          - The 16 GB plan exposes two dedicated physical cores, below the four-vCPU/core minimum.
          - The 32 GB/four-core tier would exceed the database-node 30 USD budget at the observed 40 USD monthly price.
