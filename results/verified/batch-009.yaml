      standard-compute:
        status: unknown
        notes:
          - Miami Standard XS clears the price, CPU, RAM, storage, transfer, port, and KVM requirements by advertised specification.
          - IPv4 inclusion is not explicitly verified, so strict status remains unknown.
          - Promotional current pricing must be tracked separately from the regular reference price.
      database-node:
        status: unknown
        notes:
          - Miami Standard S is extremely inexpensive for 16 GB but private-network activation, independent reliable backups, exact SLA interpretation, snapshots, and IPv4 must be resolved.
          - CPU is shared/burstable rather than dedicated.
