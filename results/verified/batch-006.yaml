    confidence: B
    resource_classes: [bargain_vps]
    verified_regions: [Poland]
    offers:
      - plan: VPS_PRO
        currency: PLN
        monthly_base_net: 59
        vcpu: 4
        cpu_allocation: shared
        memory_gb: 12
        local_storage_gb: 120
        storage_type: nvme
        transfer: unlimited_fair_use
        port_mbps: 500
        ipv4_included: true
        ipv6_available: true
      - plan: VPS_POWER
        currency: PLN
        monthly_base_net: 79
        vcpu: 6
        cpu_allocation: shared
        memory_gb: 20
        local_storage_gb: 200
        storage_type: nvme
        transfer: unlimited_fair_use
        port_mbps: 1000
        ipv4_included: true
        ipv6_available: true
    platform:
      virtualization: kvm
    contract:
      monthly_billing: true
      long_term_contract_required: false
    profile_assessment:
      standard-compute:
        status: unknown
        notes:
          - VPS PRO fails the 1 Gbps hard network floor at 500 Mbps.
          - VPS POWER meets CPU/RAM/storage/network resource floors but native-currency TCO must be normalized before the 15 USD budget filter can be resolved.
      database-node:
        status: unknown
        notes:
          - VPS POWER exceeds the capacity floor but dedicated CPU, private networking, snapshots/backups, SLA, and normalized TCO still need verification.
    sources:
      - https://sferahost.pl/store/litosfera-vps-nvme

