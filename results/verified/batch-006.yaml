schema_version: 1
verified_at: 2026-08-16
source_policy: official-only
notes:
  - This batch focuses on low-cost regional VPS/VDS candidates in Europe, Africa, South Asia, and Southeast Asia.
  - Marketing geography and actual datacenter location are recorded separately when they differ.
  - Local-currency and prepaid pricing are preserved without silently converting them into a normal month-to-month USD price.

providers:
