schema_version: 1
verified_at: 2026-08-16
source_policy: official-only
notes:
  - This batch expands low-cost KVM, configurable cloud, and regional VPS coverage.
  - Shared port speed is recorded as an interface/uplink characteristic, not as guaranteed sustained throughput.
  - Native-currency pricing is not silently converted to USD inside source verification records.
  - Exact configurable-resource prices are calculated only when every unit price is explicitly published by the provider.

providers:
  - canonical_name: InterServer
    confidence: A
    resource_classes: [bargain_vps, cloud_compute]
    verified_regions: [New_York, Dallas, Los_Angeles]
    offers:
      - plan: Cloud_Compute_4_Slices
        currency: USD
        monthly_base: 12
        cpu_cores: 2
        memory_gb: 8
        local_storage_gb: 160
        storage_type: ssd
        monthly_transfer_tb: 8
        port_mbps: 10000
        port_allocation: shared
        ipv4_included: 1
        virtualization: kvm
      - plan: Cloud_Compute_8_Slices
        currency: USD
        monthly_base: 24
        cpu_cores: 4
        memory_gb: 16
        local_storage_gb: 320
        storage_type: ssd
        monthly_transfer_tb: 16
        port_mbps: 10000
        port_allocation: shared
        ipv4_included: 1
        virtualization: kvm
    contract:
      billing: month_to_month
      annual_discount: false
      cancel_anytime: true
    network:
      additional_ipv4_usd_month: 3
      max_additional_ipv4: 5
    profile_assessment:
      standard-compute:
        status: pass
        notes:
          - Cloud Compute 4 Slices explicitly satisfies the reusable profile's monthly price, CPU, RAM, SSD, transfer, port-interface, IPv4, KVM, and monthly-billing hard requirements.
          - The 10 Gbps port is shared and is not treated as a 10 Gbps sustained-throughput guarantee; benchmark validation should measure effective throughput and contention.
      database-node:
        status: fail
        notes:
          - The 16 GB tier uses SSD rather than the database profile's required NVMe storage type.
    sources:
      - https://www.interserver.net/vps/?id=10439
      - https://www.interserver.net/vps/ubuntu-vps.html
      - https://www.interserver.net/vps/faq.html
      - https://www.interserver.net/tips/kb/shared-10-gbps-ports-on-vpss/

