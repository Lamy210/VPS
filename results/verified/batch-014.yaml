schema_version: 1
verified_at: 2026-08-16
source_policy: official-only
notes:
  - This batch expands global low-cost and configurable VPS/VDS coverage after the first 100+ verified providers.
  - Annualized prepaid pricing is kept separate from ordinary month-to-month pricing.
  - Physical-core/thread counts are not silently converted into vCPU counts for hard-filter purposes.
  - Dynamic configurators remain unknown where an exact 8 GB resource/price snapshot is not exposed by the public page.

providers:
  - canonical_name: CloudCone
    confidence: A
    resource_classes: [bargain_vps]
    verified_regions: [Missouri_US]
    offers:
      - plan: SSD_VPS_5
        currency: USD
        annual_total: 57.59
        displayed_annualized_monthly: 4.79
        billing_term: annual_prepaid
        vcpu: 8
        memory_gb: 8
        local_storage_gb: 111
        storage_type: ssd_raid10
        monthly_transfer_tb: 5
        port_mbps: 1000
        ipv4_included: 1
        ipv6_included: 3
        virtualization: kvm
      - plan: SSD_VPS_6
        currency: USD
        annual_total: 125.69
        displayed_annualized_monthly: 10.47
        billing_term: annual_prepaid
        vcpu: 10
        memory_gb: 16
        local_storage_gb: 223
        storage_type: ssd_raid10
        monthly_transfer_tb: 6
        port_mbps: 1000
        ipv4_included: 1
        ipv6_included: 3
        virtualization: kvm
    profile_assessment:
      standard-compute:
        status: unknown
        notes:
          - SSD VPS 5 clears the technical CPU/RAM/storage/transfer/port/IPv4/KVM floors.
          - The verified product is billed annually in advance; the reusable profile does not currently declare annual prepayment acceptable, so the displayed annualized monthly value is not treated as an ordinary monthly pass.
      database-node:
        status: fail
        notes:
          - The verified 16 GB tier uses SSD rather than the database profile's required NVMe storage type.
    sources:
      - https://cloudcone.com/vps/

