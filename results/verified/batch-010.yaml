schema_version: 1
verified_at: 2026-08-16
source_policy: official-only
notes:
  - This batch focuses on local and regional providers in Taiwan, Vietnam, Indonesia, the Philippines, and Malaysia.
  - Native-currency prices remain native until an explicit FX/TCO policy is applied.
  - Marketing location and actual datacenter location remain separate when the official page is ambiguous.
  - "`Up to` bandwidth is not silently treated as a guaranteed port floor."

