    operations:
      snapshots_supported: true
      full_backup_supported: true
      exact_full_backup_price_for_selected_vps: unknown
      firewall_supported: true
      ha_supported: true
    availability:
      service_availability_commitment_percent: 99.9
      network_uptime_sla_percent: 99.9
    profile_assessment:
      standard-compute:
        status: fail
        notes:
          - The smallest verified 16 GB Linux VPS costs 19.20 USD/month, above the 15 USD standard-compute ceiling.
      database-node:
        status: unknown
        notes:
          - AMD EPYC 7763 Plan 1 clears the database profile's base price, 4-vCPU, 16-GB, 200-GB NVMe, 1-Gbps unmetered, KVM, private-network, snapshot, and 99.9-percent availability requirements.
          - Server Optima states that Full Backup is supported, but the current public VPS page does not pin the selected plan's independent-backup charge. Effective TCO including the required backup remains unresolved rather than assumed to be included.
          - The HA variant is also below 30 USD before backup add-ons and uses replicated NVMe block storage.
    sources:
      - https://www.serveroptima.com/vps
      - https://www.serveroptima.com/sla

