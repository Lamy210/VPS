schema_version: 1
verified_at: 2026-08-16
source_policy: official-only
notes:
  - This batch focuses on strong low-cost leads, database-oriented VPS products, and additional regional KVM providers.
  - DDoS-protection capacity is never treated as public VPS port speed.
  - Up-to/shared network values are recorded without implying guaranteed sustained throughput.
  - Backup feature availability does not imply that backup cost is included in the advertised VM base price.
  - Long-term promotional prices remain separate from ordinary/renewal prices.

providers:
  - canonical_name: ServerCheap
    confidence: A
    resource_classes: [bargain_vps]
    verified_regions: [Dallas]
    offers:
      - plan: NVMe_KVMb_10GB_New
        currency: USD
        monthly_base: 6.80
        billing_term: monthly
        vcpu: 4
        memory_gb: 10
        local_storage_gb: 80
        storage_type: nvme
        monthly_transfer_tb: 6
        ipv4_included: 1
        ipv6_prefix: /64
        snapshots_included: 1
        virtualization: kvm
        public_port_mbps: unknown
        ddos_protection_gbps: 10
      - plan: NVMe_KVM_14GB_New
        currency: USD
        monthly_base: 8.89
        billing_term: monthly
        vcpu: 4
        memory_gb: 14
        local_storage_gb: 100
        storage_type: nvme
        monthly_transfer_tb: 8
        ipv4_included: 1
        ipv6_prefix: /64
        snapshots_included: 1
        virtualization: kvm
        public_port_mbps: unknown
    availability:
      sla_percent: 99.9
    profile_assessment:
      standard-compute:
        status: unknown
        notes:
          - The 10 GB plan clears price, CPU, RAM, NVMe, transfer, IPv4, KVM, and monthly-billing requirements.
          - The provider explicitly labels 10 Gbps as DDoS protection capacity, not VPS port speed; no qualifying public-port speed was found in the current official VPS pages.
    sources:
      - https://servercheap.com/vps/
      - https://servercheap.com/clients/store/vps-new-panel

