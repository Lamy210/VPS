        currency: USD
        regular_monthly: 180
        promotional_monthly: 90
        recurring_promo_claimed: true
        vcpu: 4
        memory_gb: 8
        local_storage_gb: 180
        storage_type: nvme
        port_gbps: 6
        monthly_transfer_tb: 3
