        promotional_monthly: 160
        recurring_promo_claimed: true
        vcpu: 8
        memory_gb: 16
        local_storage_gb: 320
        storage_type: nvme
        port_gbps: 8
        monthly_transfer_tb: 4
    network:
      asn: AS209179
      vpc: true
      floating_ip: true
      ipv6_included: true
    operations:
      rest_api: true
      terraform_ready_claimed: true
      automated_deployment: true
    availability:
      uptime_target_percent: 99.9
    profile_assessment:
