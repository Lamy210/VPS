schema_version: 1
verified_at: 2026-08-16
source_policy: official-only
notes:
  - This batch converts IX/PeeringDB/ecosystem discovery leads into official-site provider records.
  - Providers are not recommendations merely because they appear here.
  - Native currency remains unconverted until the repository FX/TCO policy is applied.

