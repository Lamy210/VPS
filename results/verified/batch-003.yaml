        local_storage_gb: 80
        storage_type: nvme
        monthly_transfer_tb: 5
        port_mbps: 1000
        cpu_allocation: shared_or_unspecified
      - plan: BASIC_4_NVMe
        currency: USD
        monthly_base: 24
        vcpu: 6
        memory_gb: 16
        local_storage_gb: 160
        storage_type: nvme
        monthly_transfer_tb: 8
        port_mbps: 1000
        cpu_allocation: shared_or_unspecified
      - plan: VDS_2
        currency: USD
        monthly_base: 36
        vcpu: 4
        memory_gb: 8
        local_storage_gb: 80
        storage_type: nvme
        monthly_transfer_tb: 10
        port_mbps: 1000
        cpu_allocation: dedicated
    network:
      ipv4_included: true
      private_network: unknown
    profile_assessment:
      standard-compute:
        status: pass
        notes:
          - BASIC_3 meets the generic 8 GB, 2+ vCPU, 60+ GB local storage, 2+ TB transfer, 1 Gbps, and <=15 USD headline requirements.
          - Private networking is still unknown and would matter for profiles that require it.
      database-node:
        status: fail
        notes:
          - Dedicated-resource VDS pricing exceeds the current 30 USD database profile ceiling at 8 GB, while the 16 GB VPS does not document dedicated CPU allocation.
    sources:
      - https://orangevps.com/zh/nvme-vps-zh/
      - https://orangevps.com/vds/

