schema_version: 1
verified_at: 2026-08-16
source_policy: official-only
notes:
  - This batch focuses on low-cost, performance-oriented, and API-driven VPS/VDS candidates.
  - Promotional, annualized, and renewal pricing are kept distinct where applicable.
  - Unknown private-network, API, or automation facts remain unknown rather than being inferred.

