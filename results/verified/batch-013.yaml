schema_version: 1
verified_at: 2026-08-16
source_policy: official-only
notes:
  - This batch expands European regional/public-cloud coverage.
  - Promotional and list prices remain separate.
  - Quote/dynamic pricing is kept unknown unless the official page exposes a stable value.

providers:
  - canonical_name: Brightbox
    confidence: A
    resource_classes: [regional_public_cloud, api_driven_cloud, managed_database, object_storage]
    verified_regions: [United_Kingdom]
    offers:
      - plan: 8gb_ssd_ram_opt
        currency: GBP
        monthly_base: 30
        hourly: 0.04110
        vcpu: 2
        memory_gb: 8
        local_storage_gb: 60
        storage_type: local_ssd
      - plan: 8gb_ssd
        currency: GBP
        monthly_base: 55
        hourly: 0.07534
        vcpu: 4
        memory_gb: 8
        local_storage_gb: 160
        storage_type: local_ssd
      - plan: 16gb_ssd
        currency: GBP
        monthly_base: 110
        hourly: 0.15068
        vcpu: 6
        memory_gb: 16
        local_storage_gb: 280
        storage_type: local_ssd
    network:
      private_networking: true
      private_traffic_free: true
      cloud_ip_ipv4_ipv6_gbp_month: 2
      outbound_internet_gbp_per_gb: 0.06
    operations:
      metered_per_minute: true
      api_destroy_stops_billing: true
      terraform_compatible_claimed: true
    additional_services:
      managed_postgresql_mysql: Cloud_SQL
      block_storage: true
      object_storage: Orbit
      managed_load_balancer_gbp_month: 20
    profile_assessment:
      standard-compute:
        status: fail
        notes:
          - The lowest 8 GB local-SSD tier is 30 GBP/month before Cloud IP and egress, above the reusable 15 USD budget even without FX normalization.
      database-node:
        status: fail
        notes:
          - Current 16 GB compute pricing is far above the reusable 30 USD database-node ceiling.
    sources:
      - https://www.brightbox.com/pricing/
      - https://www.brightbox.com/cloud/servers/
      - https://www.brightbox.com/

