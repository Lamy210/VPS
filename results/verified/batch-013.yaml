    operations:
      public_api: true
      pricing_api: true
      vm_package_api: true
      custom_iso_supported: true
    profile_assessment:
      standard-compute:
        status: unknown
        notes:
          - Current regions, VM categories and pricing/API machinery are verified, but a stable exact 8 GB package/price/storage/transfer/IP/network snapshot was not exposed on the public static page.
