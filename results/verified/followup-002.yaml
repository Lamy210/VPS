schema_version: 1
verified_at: 2026-08-17
source_policy: official-only
purpose: targeted_followup
notes:
  - This file updates existing provider records only and does not increase the unique-provider count.
  - A follow-up may resolve one blocker while leaving other hard requirements unresolved.

providers:
  - canonical_name: HostEons
    source_batch: results/verified/batch-003.yaml
    resolved:
      hybrid_vds_virtualization: kvm
      hybrid_special_2_ipv4_included: true
      hybrid_special_2_ipv6_prefix: /64
      hybrid_special_2_cpu_allocation: dedicated
      hybrid_special_2_port_gbps: 10
      hybrid_special_2_monthly_transfer_tb: 30
      hybrid_special_2_memory_gb: 8
      hybrid_special_2_local_storage_gb: 100
      hybrid_special_2_storage_type: nvme
      hybrid_special_2_monthly_usd: 8.99
    evidence_notes:
      - The current July 2026 Hybrid Dedicated Special announcement identifies Hybrid Special 2 as 2 dedicated Ryzen 3950X vCores, 8 GB RAM, 100 GB NVMe, 30 TB transfer, 10 Gbps, one IPv4, and /64 IPv6 at 8.99 USD/month.
      - HostEons' official VPS/VDS knowledgebase states that its VDS products are KVM-based and describes VDS as a KVM VPS with dedicated CPU cores.
      - HostEons separately states that KVM is used for all VPS hosting services.
    strict_effect:
      standard-compute: clear_pass
    sources:
      - https://my.hosteons.com/store/hybrid-dedicated-server-special
      - https://blog.hosteons.com/2026/07/15/hosteons-hybrid-dedicated-servers-are-back-in-stock-starting-at-just-4-99-month/
      - https://my.hosteons.com/knowledgebase/93/What-Is-the-Difference-Between-KVM-VPS-and-VDS.html
      - https://my.hosteons.com/knowledgebase/5/Which-virtualisation-technology-do-you-use-for-VPS-Hosting.html

