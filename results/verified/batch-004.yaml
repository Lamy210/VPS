schema_version: 1
verified_at: 2026-08-16
source_policy: official-only
notes:
  - This batch focuses on API-driven public cloud and managed Kubernetes capabilities.
  - Cloud products are not ranked directly against bargain VPS products on headline RAM price alone.
  - Where a pricing page is dynamic or region-dependent, feature verification and price verification remain separate.

providers:
  - canonical_name: DigitalOcean
    confidence: A
    resource_classes: [api_driven_cloud, managed_kubernetes]
    offers:
      - plan: Basic_8GiB
        currency: USD
        monthly_cap: 48
        per_second_billing: true
        vcpu: 4
        cpu_allocation: shared
        memory_gb: 8
        local_storage_gb: 160
        storage_type: ssd
        monthly_transfer_gib: 5000
      - plan: Basic_16GiB
        currency: USD
        monthly_cap: 96
        per_second_billing: true
        vcpu: 8
        cpu_allocation: shared
        memory_gb: 16
        local_storage_gb: 320
        storage_type: ssd
        monthly_transfer_gib: 6000
    network:
      vpc: true
      vpc_monthly_fee: 0
      same_datacenter_vpc_traffic_free: true
      cross_datacenter_vpc_peering_usd_per_gib: 0.01
      nat_gateway_usd_month: 40
    managed_kubernetes:
      service: DOKS
      control_plane_usd_month: 0
      ha_control_plane_usd_month: 40
      node_pool_autoscaling: true
      load_balancer_start_usd_month: 12
      worker_billing: per_second
    operations:
      api: true
      cli: true
    profile_assessment:
      standard-compute:
        status: fail
        notes:
          - The 8 GiB Basic Droplet exceeds the 15 USD generic bargain-compute ceiling.
      managed-kubernetes:
        status: candidate
        notes:
          - Free managed control plane, native autoscaling, VPC integration, and per-second worker billing are strong matches; full TCO must add worker nodes, load balancer, volumes, and optional HA control plane.
    sources:
      - https://www.digitalocean.com/pricing/droplets
      - https://docs.digitalocean.com/products/droplets/details/pricing/
      - https://www.digitalocean.com/pricing/kubernetes
      - https://docs.digitalocean.com/products/networking/vpc/details/pricing/

  - canonical_name: Akamai_Cloud
    aliases: [Linode, LKE]
    confidence: A
    resource_classes: [api_driven_cloud, managed_kubernetes, dedicated_compute]
    regions:
      asia_pacific: true
    managed_kubernetes:
      service: LKE
      standard_control_plane_additional_cost_usd_month: 0
      ha_control_plane_addon_usd_month: 60
      enterprise_control_plane_usd_month: 300
      node_pool_autoscaling: true
      standard_lke_vpc_isolated_networking: false
      enterprise_lke_vpc_isolated_networking: true
      max_worker_nodes_standard: 250
      max_worker_nodes_enterprise: 500
    compute:
      dedicated_cpu_available: true
      current_generation_cpu: AMD_EPYC
      regional_pricing_varies: true
    profile_assessment:
      standard-compute:
        status: fail
        notes:
          - Asia-Pacific dedicated compute pricing is far above the generic 15 USD bargain-compute ceiling.
      managed-kubernetes:
        status: unknown
        notes:
          - LKE provides native node-pool autoscaling and a no-additional-cost standard control plane.
          - The reusable managed-Kubernetes profile currently requires private networking; standard LKE does not provide VPC-isolated networking, while LKE Enterprise does and costs 300 USD/month plus resources.
    sources:
      - https://www.akamai.com/cloud/pricing/asia-pacific
      - https://techdocs.akamai.com/cloud-computing/docs/lke-enterprise

  - canonical_name: Kamatera
    confidence: B
    resource_classes: [api_driven_cloud]
    verified_regions: [Tokyo, Singapore, Hong_Kong, multiple_global_regions]
    offers:
      - plan: Type_A_8GB_example
        currency: USD
        monthly_example: 32
        vcpu: 2
        cpu_allocation: non_dedicated_no_guarantee
        memory_gb: 8
        local_storage_gb: 50
        storage_type: nvme
        monthly_transfer_tb: 5
    cpu_classes:
      type_A: non_dedicated_no_guarantee
      type_B: dedicated_physical_thread_reserved
      type_D: dedicated_physical_core_reserved
      type_T: burstable_dedicated_thread
    network:
      private_network: true
      load_balancer_available: true
      firewall_available: true
    operations:
      api: true
      hourly_billing: true
      monthly_billing: true
      live_vertical_scaling: true
      no_long_term_contract: true
    availability:
      stated_uptime_percent: 99.95
    profile_assessment:
      standard-compute:
        status: fail
        notes:
          - The official 8 GB Type-A example exceeds the 15 USD ceiling and has only 50 GB local storage.
      kubernetes-worker:
        status: unknown
        notes:
          - REST API, hourly billing, private networking, and broad global locations are promising for self-managed elastic clusters; Terraform/OpenTofu and automated node lifecycle still require profile-specific verification.
    sources:
      - https://www.kamatera.com/products/cloud-servers/
      - https://www.kamatera.com/pricing/
      - https://www.kamatera.com/faq/answer/which-cpu-types-are-offered-by-kamatera/
      - https://www.kamatera.com/knowledgebase/api-documentation/
      - https://www.kamatera.com/cloud-vps/japan-vps-hosting/

