schema_version: 1
verified_at: 2026-08-16
source_policy: official-only
notes:
  - This batch expands verified coverage beyond 100 providers with East and South Asian regional/public-cloud platforms.
  - Provider-native currency is retained; no implicit FX conversion is used for hard budget decisions.
  - Dynamic calculators or quote-only services remain price-unknown rather than inferred.

providers:
  - canonical_name: NAVER_Cloud_Platform
    confidence: A
    resource_classes: [regional_public_cloud, api_driven_cloud, managed_kubernetes, managed_database]
    verified_regions: [Korea, Japan, Singapore, Germany, US_West]
    offers:
      - plan: Standard_g2_2vCPU_8GB_Korea
        currency: KRW
        monthly_50gb_disk: 85120
        monthly_100gb_disk: 88000
        vcpu: 2
        memory_gb: 8
        base_disk_options_gb: [50, 100]
      - plan: SSD_Server_2vCPU_8GB_Korea
        currency: KRW
        monthly_50gb_disk: 97360
        monthly_100gb_disk: 103120
        vcpu: 2
        memory_gb: 8
        base_disk_options_gb: [50, 100]
        storage_class: ssd
    network:
      vpc: true
      private_subnet: true
      public_ip_product: true
      load_balancer: true
      nat_gateway: true
    operations:
      rest_api: true
      server_api: true
      storage_api: true
      snapshot_api: true
      public_ip_api: true
      init_script_api: true
      network_interface_api: true
      live_migration_supported_for_host_failures: true
      hourly_and_monthly_billing: true
    additional_services:
      kubernetes: Ncloud_Kubernetes_Service
      managed_postgresql: Cloud_DB_for_PostgreSQL
      managed_cache: Cloud_DB_for_Cache
      object_storage: true
    profile_assessment:
      standard-compute:
        status: unknown
        notes:
          - Current 8 GB pricing, API, VPC, and storage options are verified, but native-currency TCO, transfer allowance, public port speed, IPv4 inclusion semantics, and exact KVM requirement remain unresolved.
      managed-kubernetes:
        status: unknown
        notes:
          - Ncloud Kubernetes Service and VPC exist, but the reusable profile requires a single concrete worker architecture plus autoscaling, load balancer, Terraform/OpenTofu, monitoring, 1-Gbps port, storage, and IPv4 verification together.
    sources:
      - https://www.ncloud.com/charge/price/ko
      - https://www.ncloud.com/charge/price/jp
      - https://api.ncloud-docs.com/docs/en/compute-vserver
      - https://guide.ncloud-docs.com/docs/en/server-create-vpc
      - https://guide.ncloud-docs.com/docs/en/server-manage-vpc

