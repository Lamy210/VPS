schema_version: 1
verified_at: 2026-08-16
source_policy: official-only
notes:
  - This batch expands global VPS and cloud coverage with providers surfaced from regional, managed-hosting, and cloud-platform discovery.
  - Temporary introductory or sale pricing is kept separate from ordinary pricing.
  - Up-to or shared network speed is not treated as guaranteed sustained throughput.
  - Missing hypervisor, IPv4, transfer, or exact configuration values remain unknown rather than inferred.

providers:
  - canonical_name: Hivelocity
    confidence: A
    resource_classes: [performance_vps, performance_vds]
    verified_regions: [Orangeburg_NY, Tampa_FL, Los_Angeles]
    offers:
      - plan: pro_md_amd
        currency: USD
        regular_monthly: 20
        sale_monthly: 15
        promotional: true
        vcpu: 4
        memory_gb: 8
        local_storage_gb: 80
        storage_type: nvme
        monthly_transfer_tb: 10
        port_mbps: 1000
      - plan: vds_md_intel
        currency: USD
        regular_monthly: 42
        sale_monthly: 37
        promotional: true
        vcpu: 4
        memory_gb: 8
        local_storage_gb: 160
        monthly_transfer_tb: 10
        port_mbps: 1000
        allocation: virtual_dedicated
    profile_assessment:
      standard-compute:
        status: unknown
        notes:
          - pro.md.amd reaches the current 15 USD ceiling only through an active sale.
          - Exact virtualization technology and IPv4 inclusion for the selected product are not pinned by the verified public pricing page, and sale persistence is unresolved.
    sources:
      - https://www.hivelocity.net/vps-and-vds/
      - https://www.hivelocity.net/pricing

